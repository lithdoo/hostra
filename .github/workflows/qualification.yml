name: Hostra qualification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualification:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and pinned Electron
        run: npm ci
        env:
          HOSTRA_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Run qualification on Windows
        if: runner.os == 'Windows'
        run: npm test

      - name: Run qualification on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum npm test 2>&1 | tee /tmp/hostra-qualification.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -c 6000 /tmp/hostra-qualification.log | node -e '
              let text = "";
              process.stdin.on("data", chunk => { text += chunk; });
              process.stdin.on("end", () => {
                const escaped = text
                  .replace(/%/g, "%25")
                  .replace(/\r/g, "%0D")
                  .replace(/\n/g, "%0A");
                console.log(`::error title=Linux qualification failure::${escaped}`);
              });
            '
          fi
          exit "$status"
